<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafting App Architecture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Same tokens and diagram classes as docs/iwr-explainer.html. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #17202c; --muted: #5d6878; --line: #dde2ea;
  --accent: #3b5bdb; --copy: #1f8a5b; --copy-bg: #dff3e9;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --line: #273142; --accent: #8ea6ff; --copy: #5fd39b; --copy-bg: #173a2b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --line: #273142; --accent: #8ea6ff; --copy: #5fd39b; --copy-bg: #173a2b; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.page { max-width: 920px; margin: 0 auto; display: grid; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; }
/* @diagram:start */
.arch-wrap { overflow-x: auto; }
.arch-wrap svg { display: block; width: 100%; min-width: 880px; height: auto; }
.arch .bg { fill: var(--bg); }
.arch .mask { fill: var(--bg); }
.arch .band { fill: var(--panel); fill-opacity: 0.45; stroke: var(--muted); stroke-opacity: 0.45; stroke-dasharray: 5 4; }
.arch .node { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
.arch .node.focal { fill: var(--copy-bg); stroke: var(--copy); stroke-width: 1.4; }
.arch .name { fill: var(--ink); font: 600 14px var(--font-body); }
.arch .sub { fill: var(--muted); font: 400 10.5px var(--font-mono); }
.arch .sub.focal { fill: var(--copy); }
.arch .eyb { fill: var(--muted); font: 600 9px var(--font-mono); letter-spacing: 0.1em; }
.arch .lbl { fill: var(--muted); font: 600 8.5px var(--font-mono); letter-spacing: 0.06em; }
.arch .lbl.focal { fill: var(--copy); }
.arch .lbl.link { fill: var(--accent); }
.arch .flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.arch .flow.focal { stroke: var(--copy); }
.arch .flow.link { stroke: var(--accent); }
.arch .flow.dash { stroke-dasharray: 5 4; }
.arch .tip { fill: var(--muted); }
.arch .tip.focal { fill: var(--copy); }
.arch .tip.link { fill: var(--accent); }
.arch .rule { stroke: var(--line); stroke-width: 1; }
/* @diagram:end */
</style>
</head>
<body>
<div class="page">
  <span class="eyebrow">Drafting app</span>
  <h1>App architecture and inference path</h1>
<!-- @svg:start -->
<div class="arch-wrap">
<svg class="arch" viewBox="0 0 880 668" role="img" aria-labelledby="app-arch-title app-arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="app-arch-title">Drafting app architecture</title>
  <desc id="app-arch-desc">The editor sends an edit to FastAPI, which wraps the selection in highlight tags and passes it to a LangChain chain; the chain calls vLLM on the GPU server over its OpenAI-compatible API, where an n-gram drafter copies tokens from the document and Ministral 3 8B verifies them in one pass using a cached prefix, and the reply is spliced back into the document and stored in MinIO with its timing.</desc>
  <defs>
    <marker id="aa-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon class="tip" points="0 0, 8 3, 0 6"/></marker>
    <marker id="aa-arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon class="tip focal" points="0 0, 8 3, 0 6"/></marker>
    <marker id="aa-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon class="tip link" points="0 0, 8 3, 0 6"/></marker>
  </defs>
  <rect class="bg" width="880" height="668"/>

  <!-- layers -->
  <rect class="band" x="24" y="24" width="832" height="88" rx="8"/>
  <text class="eyb" x="40" y="44">LAYER 1 · BROWSER</text>
  <rect class="band" x="24" y="136" width="832" height="200" rx="8"/>
  <text class="eyb" x="40" y="156">LAYER 2 · APP · DOCKER COMPOSE ON THE MAC</text>
  <rect class="band" x="24" y="376" width="832" height="216" rx="8"/>
  <text class="eyb" x="40" y="396">LAYER 3 · GPU SERVER · vLLM :8001</text>

  <!-- connectors (before nodes) -->
  <line class="flow" x1="440" y1="98" x2="440" y2="166" marker-start="url(#aa-arrow)" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="448" y="120" width="62" height="12" rx="2"/>
  <text class="lbl" x="479" y="129" text-anchor="middle">EDIT / DIFF</text>

  <path class="flow" d="M320 194 H222 Q214 194 214 202 V254" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="238" y="172" width="54" height="12" rx="2"/>
  <text class="lbl" x="265" y="181" text-anchor="middle">SELECTION</text>

  <line class="flow" x1="560" y1="194" x2="638" y2="194" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="569" y="172" width="62" height="12" rx="2"/>
  <text class="lbl" x="600" y="181" text-anchor="middle">DOCS · RUNS</text>

  <line class="flow" x1="324" y1="272" x2="554" y2="272" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="404" y="250" width="70" height="12" rx="2"/>
  <text class="lbl" x="439" y="259" text-anchor="middle">TAGGED DOC</text>
  <line class="flow" x1="556" y1="296" x2="326" y2="296" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="404" y="304" width="70" height="12" rx="2"/>
  <text class="lbl" x="439" y="313" text-anchor="middle">MODEL OUTPUT</text>

  <line class="flow link" x1="676" y1="314" x2="676" y2="406" marker-start="url(#aa-arrow-link)" marker-end="url(#aa-arrow-link)"/>
  <rect class="mask" x="604" y="350" width="64" height="12" rx="2"/>
  <text class="lbl link" x="636" y="359" text-anchor="middle">OPENAI API</text>

  <path class="flow" d="M556 432 H212 Q204 432 204 440 V506" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="328" y="410" width="76" height="12" rx="2"/>
  <text class="lbl" x="366" y="419" text-anchor="middle">PROMPT TOKENS</text>

  <line class="flow" x1="568" y1="456" x2="568" y2="506" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="576" y="475" width="40" height="12" rx="2"/>
  <text class="lbl" x="596" y="484" text-anchor="middle">VERIFY</text>

  <line class="flow focal" x1="304" y1="536" x2="358" y2="536" marker-end="url(#aa-arrow-focal)"/>
  <rect class="mask" x="307" y="514" width="48" height="12" rx="2"/>
  <text class="lbl focal" x="331" y="523" text-anchor="middle">DRAFT ≤8</text>

  <line class="flow" x1="582" y1="536" x2="634" y2="536" marker-start="url(#aa-arrow)" marker-end="url(#aa-arrow)"/>
  <rect class="mask" x="590" y="514" width="36" height="12" rx="2"/>
  <text class="lbl" x="608" y="523" text-anchor="middle">REUSE</text>

  <!-- nodes -->
  <rect class="node" x="320" y="48" width="240" height="48" rx="6"/>
  <text class="name" x="334" y="68">Editor UI</text>
  <text class="sub" x="334" y="85">CodeMirror · select · diff</text>

  <rect class="node" x="320" y="168" width="240" height="52" rx="6"/>
  <text class="name" x="334" y="190">FastAPI</text>
  <text class="sub" x="334" y="207">/edit /prime /versions</text>

  <rect class="node" x="640" y="168" width="200" height="52" rx="6"/>
  <text class="name" x="654" y="190">MinIO</text>
  <text class="sub" x="654" y="207">documents/ · runs/</text>

  <rect class="node" x="104" y="256" width="220" height="56" rx="6"/>
  <text class="name" x="118" y="279">Highlight engine</text>
  <text class="sub" x="118" y="296">wrap tags · splice reply</text>

  <rect class="node" x="556" y="256" width="240" height="56" rx="6"/>
  <text class="name" x="570" y="279">LangChain chain</text>
  <text class="sub" x="570" y="296">prompt | ChatOpenAI t=0</text>

  <rect class="node" x="556" y="408" width="240" height="48" rx="6"/>
  <text class="name" x="570" y="428">vLLM OpenAI server</text>
  <text class="sub" x="570" y="445">SPEC_METHOD ngram | off</text>

  <rect class="node focal" x="104" y="508" width="200" height="56" rx="6"/>
  <text class="name" x="118" y="531">N-gram drafter</text>
  <text class="sub focal" x="118" y="548">copies from document</text>

  <rect class="node focal" x="360" y="508" width="220" height="56" rx="6"/>
  <text class="name" x="374" y="531">Ministral 3 8B</text>
  <text class="sub focal" x="374" y="548">checks drafts in 1 pass</text>

  <rect class="node" x="636" y="508" width="200" height="56" rx="6"/>
  <text class="name" x="650" y="531">Prefix + KV cache</text>
  <text class="sub" x="650" y="548">document primed on open</text>

  <!-- legend -->
  <line class="rule" x1="24" y1="616" x2="856" y2="616"/>
  <text class="eyb" x="24" y="644">LEGEND</text>
  <rect class="node" x="96" y="634" width="20" height="14" rx="3"/>
  <text class="sub" x="124" y="645">component</text>
  <rect class="node focal" x="220" y="634" width="20" height="14" rx="3"/>
  <text class="sub" x="248" y="645">inference with reference</text>
  <line class="flow link" x1="440" y1="641" x2="472" y2="641" marker-end="url(#aa-arrow-link)"/>
  <text class="sub" x="482" y="645">network hop</text>
  <rect class="band" x="592" y="634" width="20" height="14" rx="3"/>
  <text class="sub" x="620" y="645">layer</text>
</svg>
</div>
<!-- @svg:end -->
</div>
</body>
</html>
