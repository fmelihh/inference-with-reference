<svg width="880" height="444" class="arch" viewBox="0 0 880 444" role="img" aria-labelledby="iwr-mech-title iwr-mech-desc" xmlns="http://www.w3.org/2000/svg">
<style>
/* Same tokens and diagram classes as docs/iwr-explainer.html and docs/ministral-architecture.html. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #17202c; --muted: #5d6878; --line: #dde2ea;
  --accent: #3b5bdb; --copy: #1f8a5b; --copy-bg: #dff3e9;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --line: #273142; --accent: #8ea6ff; --copy: #5fd39b; --copy-bg: #173a2b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #98a3b3; --line: #273142; --accent: #8ea6ff; --copy: #5fd39b; --copy-bg: #173a2b; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.page { max-width: 920px; margin: 0 auto; display: grid; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; }
h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 24px 0 0; }
.arch-wrap { overflow-x: auto; }
.arch-wrap svg { display: block; width: 100%; min-width: 880px; height: auto; }
.arch .bg { fill: var(--bg); }
.arch .mask { fill: var(--bg); }
.arch .node { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
.arch .node.focal { fill: var(--copy-bg); stroke: var(--copy); stroke-width: 1.4; }
.arch .name { fill: var(--ink); font: 600 14px var(--font-body); }
.arch .sub { fill: var(--muted); font: 400 10.5px var(--font-mono); }
.arch .sub.focal { fill: var(--copy); }
.arch .eyb { fill: var(--muted); font: 600 9px var(--font-mono); letter-spacing: 0.1em; }
.arch .lbl { fill: var(--muted); font: 600 8.5px var(--font-mono); letter-spacing: 0.06em; }
.arch .flow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.arch .flow.dash { stroke-dasharray: 5 4; }
.arch .tip { fill: var(--muted); }
.arch .dot { fill: var(--ink); }
.arch .rule { stroke: var(--line); stroke-width: 1; }
</style>
  <title id="iwr-mech-title">Inference with reference mechanism</title>
  <desc id="iwr-mech-desc">The n-gram matcher finds the end of the output inside the prompt document, copies the following tokens as a draft, the model verifies the whole draft in one forward pass, accepted tokens are appended to the output and rejected ones are rolled back from the KV cache before the next lookup.</desc>
  <defs>
    <marker id="im-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="tip" points="0 0, 8 3, 0 6"/></marker>
  </defs>
  <rect class="bg" width="880" height="444"/>

  <!-- connectors -->
  <line class="flow" x1="208" y1="70" x2="254" y2="70" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="211" y="48" width="40" height="12" rx="2"/>
  <text class="lbl" x="231" y="57" text-anchor="middle">SEARCH</text>

  <line class="flow" x1="440" y1="70" x2="486" y2="70" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="443" y="48" width="40" height="12" rx="2"/>
  <text class="lbl" x="463" y="57" text-anchor="middle">COPY ≤8</text>

  <line class="flow" x1="640" y1="70" x2="694" y2="70" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="647" y="48" width="40" height="12" rx="2"/>
  <text class="lbl" x="667" y="57" text-anchor="middle">VERIFY</text>

  <line class="flow" x1="776" y1="100" x2="776" y2="174" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="726" y="131" width="42" height="12" rx="2"/>
  <text class="lbl" x="747" y="140" text-anchor="middle">LOGITS</text>

  <line class="flow" x1="696" y1="206" x2="642" y2="206" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="649" y="184" width="40" height="12" rx="2"/>
  <text class="lbl" x="669" y="193" text-anchor="middle">APPEND</text>

  <path class="flow dash" d="M456 206 H356 Q348 206 348 198 V102" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="292" y="146" width="48" height="12" rx="2"/>
  <text class="lbl" x="316" y="155" text-anchor="middle">LAST 2–4</text>

  <line class="flow" x1="776" y1="236" x2="776" y2="298" marker-end="url(#im-arrow)"/>
  <rect class="mask" x="718" y="261" width="50" height="12" rx="2"/>
  <text class="lbl" x="743" y="270" text-anchor="middle">ROLLBACK</text>

  <!-- nodes -->
  <rect class="node" x="24" y="40" width="184" height="60" rx="6"/>
  <text class="name" x="38" y="64">Prompt document</text>
  <text class="sub" x="38" y="82">the reference text</text>

  <rect class="node" x="256" y="40" width="184" height="60" rx="6"/>
  <text class="name" x="270" y="64">N-gram matcher</text>
  <text class="sub" x="270" y="82">find suffix in prompt</text>

  <rect class="node" x="488" y="40" width="152" height="60" rx="6"/>
  <text class="name" x="502" y="64">Draft tokens</text>
  <text class="sub" x="502" y="82">what came next</text>

  <rect class="node focal" x="696" y="40" width="160" height="60" rx="6"/>
  <text class="name" x="710" y="64">Ministral 8B</text>
  <text class="sub focal" x="710" y="82">all drafts, 1 pass</text>

  <rect class="node" x="696" y="176" width="160" height="60" rx="6"/>
  <text class="name" x="710" y="200">Accept / reject</text>
  <text class="sub" x="710" y="218">prefix + 1 own token</text>

  <rect class="node" x="456" y="176" width="184" height="60" rx="6"/>
  <text class="name" x="470" y="200">Output so far</text>
  <text class="sub" x="470" y="218">identical to normal</text>

  <rect class="node" x="696" y="300" width="160" height="60" rx="6"/>
  <text class="name" x="710" y="324">KV cache</text>
  <text class="sub" x="710" y="342">drops rejected keys</text>

  <!-- legend -->
  <line class="rule" x1="24" y1="388" x2="856" y2="388"/>
  <text class="eyb" x="24" y="420">LEGEND</text>
  <rect class="node" x="96" y="410" width="20" height="14" rx="3"/>
  <text class="sub" x="124" y="421">component</text>
  <rect class="node focal" x="232" y="410" width="20" height="14" rx="3"/>
  <text class="sub" x="260" y="421">one forward pass</text>
  <line class="flow dash" x1="408" y1="417" x2="440" y2="417" marker-end="url(#im-arrow)"/>
  <text class="sub" x="450" y="421">feeds the next lookup</text>
</svg>
